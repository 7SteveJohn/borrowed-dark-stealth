<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borrowed Dark — a stealth escape</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1a13; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #ui { position: fixed; top: 12px; right: 12px; display: flex; gap: 8px; z-index: 2; }
  #ui button {
    font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #f4efe0; background: rgba(29, 92, 63, 0.85); border: 1px solid #f4efe0;
    border-radius: 8px; padding: 7px 12px; cursor: pointer;
  }
  #ui button:hover { background: #2a7a54; }
  #ui button:focus-visible { outline: 2px solid #fde68a; outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="game" aria-label="Borrowed Dark: steal palm shadows, slip past the guards' vision cones, and reach the glowing exit unseen"></canvas>
<div id="ui">
  <button id="pause-btn" type="button" title="Pause (P)">⏸ Pause</button>
  <button id="restart-btn" type="button" title="Restart (R)">↻ Restart</button>
  <button id="mute-btn" type="button" title="Mute (M)">🔊 Sound</button>
  <button id="help-btn" type="button" title="How to play">? Help</button>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
